services:
  mcp:
    build:
      context: ../..
      target: runtime
    environment:
      PORT: "${PORT}"
      MCP_TRANSPORT: "${MCP_TRANSPORT}"
      MCP_REQUIRE_AUTH: "${MCP_REQUIRE_AUTH}"
      MCP_RATE_PER_MIN: "${MCP_RATE_PER_MIN}"
      MCP_LOG_BUDGET: "${MCP_LOG_BUDGET}"
      MCP_TOKEN_MINT_PER_HOUR: "${MCP_TOKEN_MINT_PER_HOUR}"
      CLOCKCHAIN_CLIENT_ID: "${CLOCKCHAIN_CLIENT_ID}"
      CLOCKCHAIN_WALLET_ID: "${CLOCKCHAIN_WALLET_ID}"
      CLOCKCHAIN_ENDPOINT: "${CLOCKCHAIN_ENDPOINT}"
      ERC8004_REGISTRY_ADDRESS: "${ERC8004_REGISTRY_ADDRESS}"
      HANDSHAKE_RELAY: "${HANDSHAKE_RELAY}"
      MCP_HANDSHAKE_FILE: /app/state/handshake.json
      MCP_HANDSHAKE_INVITATION_FILE: /app/state/agent-handshake-invitations.json
      AGENT_HANDSHAKE_JOIN_URL: "${AGENT_HANDSHAKE_JOIN_URL:-https://clockchain-research.vercel.app/handshake/join}"
      AGENT_HANDSHAKE_RELEASE_PIN: "${AGENT_HANDSHAKE_RELEASE_PIN}"
      AGENT_HANDSHAKE_ROLE_ACCESS_ACTIVE: "${AGENT_HANDSHAKE_ROLE_ACCESS_ACTIVE}"
      AGENT_HANDSHAKE_ROLE_ACCESS_PREVIOUS: "${AGENT_HANDSHAKE_ROLE_ACCESS_PREVIOUS:-}"
      AGENT_HANDSHAKE_ACCEPTANCE_HMAC_ACTIVE: "${AGENT_HANDSHAKE_ACCEPTANCE_HMAC_ACTIVE}"
      AGENT_HANDSHAKE_ACCEPTANCE_HMAC_PREVIOUS: "${AGENT_HANDSHAKE_ACCEPTANCE_HMAC_PREVIOUS:-}"
      AGENT_HANDSHAKE_V2_INVITATION_FILE: /app/state/agent-handshake-v2-invitations.json
      AGENT_HANDSHAKE_V2_STATE_FILE: /app/state/agent-handshake-v2-state.json
      # B2 durability: Standalone sessions and the csha_/ccra_ role-handle maps live under
      # /app/state/standalone-handshake/ and /app/state/agent-handshake-v2/ (mcp_state volume).
      HANDSHAKE_STATE_DIR: /app/state
      AGENT_HANDSHAKE_INVITES_PER_HOUR: "20"
      AGENT_HANDSHAKE_CALLS_PER_MINUTE: "120"
      AGENT_HANDSHAKE_TRUSTED_PROXY: "172.30.0.3"
      HANDSHAKE_ALLOW_DEGRADED: "${HANDSHAKE_ALLOW_DEGRADED}"
      EVM_RPC_URL: "${EVM_RPC_URL}"
      CLOCKCHAIN_API_KEY: "${CLOCKCHAIN_API_KEY}"
      MCP_AUTH_TOKENS: "${MCP_AUTH_TOKENS}"
      MCP_TOKEN_SIGNING_SECRET: "${MCP_TOKEN_SIGNING_SECRET}"
      CLOCKCHAIN_SIGNING_SECRET: "${CLOCKCHAIN_SIGNING_SECRET}"
      CLOCKCHAIN_SIGNING_KEY_ID: "${CLOCKCHAIN_SIGNING_KEY_ID}"
      KEEPER_STORE_PATH: "${KEEPER_STORE_PATH}"
      KEEPER_WEBHOOK_SECRET: "${KEEPER_WEBHOOK_SECRET}"
      KEEPER_WEBHOOK_ALLOWLIST: "${KEEPER_WEBHOOK_ALLOWLIST}"
      STANDALONE_WEBHOOK_SECRET: "${STANDALONE_WEBHOOK_SECRET}"
      STANDALONE_PUBLIC_ENDPOINT: "${STANDALONE_PUBLIC_ENDPOINT}"
      CLOCKCHAIN_SUBSTRATE: "${CLOCKCHAIN_SUBSTRATE}"
      MCP_METRICS_TOKEN: "${MCP_METRICS_TOKEN:-}"
      # /contract/mcp surface (N7c): the route ships DISABLED unless
      # CONTRACT_MCP_ENABLED=1 exists in SSM. compose-up.sh reads each
      # /clockchain/mcp/<NAME> parameter only when present, so a host-unset
      # var injects "" here — config.ts treats "" exactly like absent.
      CONTRACT_MCP_ENABLED: "${CONTRACT_MCP_ENABLED:-}"
      CONTRACT_AUTH_TOKENS: "${CONTRACT_AUTH_TOKENS:-}"
      CONTRACT_HOST_ROOTS: "${CONTRACT_HOST_ROOTS:-}"
      CONTRACT_SERVER_ED25519_SEED: "${CONTRACT_SERVER_ED25519_SEED:-}"
      CONTRACT_SERVER_KEY_ID: "${CONTRACT_SERVER_KEY_ID:-}"
      CONTRACT_ALLOW_EPHEMERAL_KEY: "${CONTRACT_ALLOW_EPHEMERAL_KEY:-}"
      CONTRACT_SERVER_KEY_VALID_FROM: "${CONTRACT_SERVER_KEY_VALID_FROM:-}"
      CONTRACT_SERVER_KEY_VALID_UNTIL: "${CONTRACT_SERVER_KEY_VALID_UNTIL:-}"
      CONTRACT_POLICY_DIGESTS: "${CONTRACT_POLICY_DIGESTS:-}"
      CONTRACT_PRINCIPALS: "${CONTRACT_PRINCIPALS:-}"
      CONTRACT_OBSERVER_TOKEN: "${CONTRACT_OBSERVER_TOKEN:-}"
      CONTRACT_VERIFIER_TOKEN: "${CONTRACT_VERIFIER_TOKEN:-}"
      CONTRACT_ALLOW_SIM_FAULTS: "${CONTRACT_ALLOW_SIM_FAULTS:-}"
      CONTRACT_SIM_FAULTS: "${CONTRACT_SIM_FAULTS:-}"
      CONTRACT_LEVEL: "${CONTRACT_LEVEL:-}"
      CONTRACT_REQUIRE_BIND_STATEMENT: "${CONTRACT_REQUIRE_BIND_STATEMENT:-}"
      TELEMETRY_CLOSE_URL: "${TELEMETRY_CLOSE_URL:-}"
      TELEMETRY_CLOSE_BACKOFF_MS: "${TELEMETRY_CLOSE_BACKOFF_MS:-}"
      TELEMETRY_CLOSE_ATTEMPT_TIMEOUT_MS: "${TELEMETRY_CLOSE_ATTEMPT_TIMEOUT_MS:-}"
      TELEMETRY_CLOSE_DEADLINE_MS: "${TELEMETRY_CLOSE_DEADLINE_MS:-}"
      CONTRACT_CALLS_PER_MINUTE: "${CONTRACT_CALLS_PER_MINUTE:-}"
      CONTRACT_OBSERVER_PER_MINUTE: "${CONTRACT_OBSERVER_PER_MINUTE:-}"
      CONTRACT_MAX_RUNS: "${CONTRACT_MAX_RUNS:-}"
      CONTRACT_MAX_RECEIPTS_PER_RUN: "${CONTRACT_MAX_RECEIPTS_PER_RUN:-}"
      CONTRACT_MAX_RECEIPTS_PER_PRINCIPAL: "${CONTRACT_MAX_RECEIPTS_PER_PRINCIPAL:-}"
      CONTRACT_RUN_TTL_MS: "${CONTRACT_RUN_TTL_MS:-}"
      CONTRACT_CERT_GRACE_MS: "${CONTRACT_CERT_GRACE_MS:-}"
      CONTRACT_SESSION_TTL_MS: "${CONTRACT_SESSION_TTL_MS:-}"
      CONTRACT_STATE_DIR: "${CONTRACT_STATE_DIR:-}"
      CONTRACT_ERC8004_CHAIN_ID: "${CONTRACT_ERC8004_CHAIN_ID:-}"
      CONTRACT_ERC8004_REGISTRY_ADDRESS: "${CONTRACT_ERC8004_REGISTRY_ADDRESS:-}"
      CONTRACT_ANCHOR_ENABLED: "${CONTRACT_ANCHOR_ENABLED:-}"
      CONTRACT_SETTLEMENT_RAIL: "${CONTRACT_SETTLEMENT_RAIL:-}"
      CONTRACT_TRUST_PROXY: "${CONTRACT_TRUST_PROXY:-}"
    volumes:
      - mcp_state:/app/state
    expose:
      - "8080"
    networks:
      clockchain_edge:
        ipv4_address: 172.30.0.2
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          fetch("http://127.0.0.1:" + (process.env.PORT ?? "8080") + "/health")
            .then((response) => {
              if (!response.ok) process.exit(1);
            })
            .catch(() => process.exit(1));
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  host:
    build:
      context: ${HANDSHAKE_APP_ROOT:-/opt/clockchain-host/app}
    command: ["node", "bin/agent-handshake-host.mjs"]
    environment:
      HANDSHAKE_RELAY: "${HANDSHAKE_RELAY}"
      HANDSHAKE_SHA: "${HANDSHAKE_SHA}"
      HANDSHAKE_KIT_REPO: "${HANDSHAKE_KIT_REPO}"
      HANDSHAKE_PROTOCOL: "clockchain.agent-handshake/v2"
      AGENT_HANDSHAKE_PROTOCOL: "clockchain.agent-handshake/v2"
      CLOCKCHAIN_HOST_ROOT_KEY_ID: "${CLOCKCHAIN_HOST_ROOT_KEY_ID}"
      CLOCKCHAIN_HOST_ROOT_KEY_FILE: /app/keys/agent-handshake-v2-host-root.pem
      AGENT_HANDSHAKE_V2_FUNDING_LEDGER: /app/runs/private/v2-funding-ledger.jsonl
      AGENT_HANDSHAKE_V2_FUNDING_QUEUE_LIMIT: "16"
      AGENT_HANDSHAKE_V2_FUNDING_ALERT_HOURLY_ETH: "0.16"
      AGENT_HANDSHAKE_V2_FUNDING_ALERT_DAILY_ETH: "0.80"
      CLOCKCHAIN_FUNDING_KEYSTORE: /app/keys/funding-wallet.json
      CLOCKCHAIN_FUNDING_PASSWORD_FILE: /app/keys/funding.password
      SEPOLIA_RPC_URL: "${EVM_RPC_URL}"
    volumes:
      - ${CLOCKCHAIN_HOST_SECRET_DIR:-/run/clockchain-host-secrets}:/app/keys:ro
      - host_runs:/app/runs
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    depends_on:
      mcp:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    networks:
      clockchain_edge:
        ipv4_address: 172.30.0.3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  host_runs:
  mcp_state:

networks:
  clockchain_edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24
